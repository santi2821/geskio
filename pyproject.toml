[project]
name = "geskio"
version = "1.0.0"
description = "GesKio - Gestión de negocio para emprendedores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet==0.84.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
